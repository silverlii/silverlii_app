<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 首尔跑腿 아이콘: 달려가는 쇼핑백 + 남산타워 -->
  <rect width="512" height="512" rx="112" fill="#E0485C"/>
  <g stroke="#fff" stroke-linecap="round" fill="none">
    <line x1="58" y1="250" x2="140" y2="250" stroke-width="20" opacity=".55"/>
    <line x1="84" y1="306" x2="150" y2="306" stroke-width="20" opacity=".8"/>
    <line x1="58" y1="362" x2="140" y2="362" stroke-width="20" opacity=".55"/>
  </g>
  <g transform="rotate(-8 300 320)">
    <!-- 쇼핑백 몸통(위가 좁은 사다리꼴) -->
    <path d="M206 196 H394 L418 440 H182 Z" fill="#fff" stroke="#fff" stroke-width="22" stroke-linejoin="round"/>
    <!-- 손잡이 + 구멍 -->
    <path d="M254 238 V168 a46 46 0 0 1 92 0 V238" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round"/>
    <circle cx="254" cy="238" r="10" fill="#E0485C"/>
    <circle cx="346" cy="238" r="10" fill="#E0485C"/>
    <!-- 남산타워 -->
    <g fill="#E0485C">
      <rect x="297" y="270" width="8" height="30" rx="4"/>
      <rect x="279" y="296" width="44" height="24" rx="12"/>
      <rect x="293" y="318" width="16" height="70" rx="4"/>
      <path d="M266 414 L301 380 L336 414 Z"/>
    </g>
  </g>
</svg>
