// 상품가가 박스 한도(boxCny)를 넘으면 n박스로 나누고, 박스마다 (상품 무게/n + 포장) 요금을 더함
function boxN(){var q=qtyN();if(!q||!(CFG.boxCny>0))return 1;return Math.min(q,Math.max(1,Math.ceil(sum()*CFG.rate/CFG.boxCny)))}
function emsOf(kg){for(var i=0;i<CFG.ems.length;i++)if(CFG.ems[i].k>=kg-1e-9)return CFG.ems[i];return null}
function autoSh(){if(!qtyN())return{st:-1};var n=boxN(),pg=wtG()-CFG.packG,kg=(pg+CFG.packG*n)/1000;if(kg>CFG.maxKg)return{st:2,kg:kg,n:n};
 var r=emsOf((pg/n+CFG.packG)/1000);if(!r)return{st:2,kg:kg,n:n};return{st:0,kg:kg,n:n,k:r.k,krw:(r.krw+CFG.extra)*n}}
function shipOk(){return sh.st===0}
function shipKrw(){return shipOk()?sh.krw:0}
function shipTxt(){var z=L=="zh",w=(z?"约":"약 ")+(+sh.kg.toFixed(2))+"kg",b=sh.n>1?(z?" · "+sh.n+"箱":" · "+sh.n+"박스"):"";return w+b+(sh.st==2?(z?" → 需报价":" → 견적 필요"):(sh.n>1?(z?" → 每箱"+sh.k+"kg档":" → 박스당 "+sh.k+"kg 구간"):(z?" → "+sh.k+"kg档":" → "+sh.k+"kg 구간")))}
function rateTxt(){return (L=="zh"?"汇率 ¥1 = ":"환율 1위안 = ")+"₩"+Math.round(1/CFG.rate).toLocaleString("ko-KR")}
function feeOf(s){return s>0?Math.max(Math.round(s*CFG.fee),CFG.min):0}
// 합계 = 상품 + 대행 수수료 + 검수·포장비(박스당) + EMS + 결제 수수료(앞 금액 합의 payFee)
function bfFree(s){return CFG.boxFree>0&&s>=CFG.boxFree}
function totals(){var s=sum(),f=feeOf(s),bf=qtyN()&&!bfFree(s)?CFG.boxFee*(sh.n||1):0,sf=shipKrw(),b=s+f+bf+sf,pf=Math.round(b*CFG.payFee);return{s:s,f:f,bf:bf,sf:sf,pf:pf,t:b+pf}}
function chg(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);draw()}
function addLink(){
 var u=document.getElementById("lu").value.trim();if(!u)return;
 links.push({u:u,o:document.getElementById("lo").value.trim(),q:Math.max(1,+document.getElementById("lq").value||1)});draw()}
function delLink(i){links.splice(i,1);draw()}
function sum(){var s=0;PRODUCTS.forEach(function(p){s+=(cart[p.id]||0)*p.krw});return s}
var curNo="";
function newNo(){var d=new Date(),z=function(n){return("0"+n).slice(-2)};return String(d.getFullYear()).slice(2)+z(d.getMonth()+1)+z(d.getDate())+"-"+z(d.getHours())+z(d.getMinutes())+"-"+Math.floor(100+Math.random()*900)}
function qrHtml(){return CFG.qr?'<img src="'+esc(CFG.qr)+'" alt="WeChat" style="width:140px;height:140px;border-radius:10px;margin-top:8px;display:block">':""}
// 접수 완료 카드: 주문서를 위챗으로 보낼 수 있게 복사 버튼 제공 (링크 상품이 있으면 강조)
function showOk(no,t,hasL){var e=document.getElementById("okc");e.className="card";
 e.innerHTML='<b>✅ '+tx("oka")+'</b><p style="margin:8px 0">'+tx("okn")+': <b style="font-size:18px">'+no+'</b></p>'+(hasL?'<p style="color:var(--ac);font-weight:600;margin:8px 0">'+tx("okl")+'</p>':'<p class="note">'+tx("okm")+'</p>')+
 '<textarea id="okt" rows="5" readonly style="font-size:12px"></textarea><button class="btn'+(hasL?'':' o')+'" id="okb" onclick="copyOk()">'+tx("okc")+'</button><p class="note">'+tx("go")+' <b>'+esc(CFG.wechat)+'</b></p>'+qrHtml();
 document.getElementById("okt").value=t||"";
 if(e.scrollIntoView)e.scrollIntoView({behavior:"smooth"})}
function footHtml(){
 var b=CFG.biz||{},z=L=="zh",pol=((z?CFG.polZh:CFG.polKo)||tx("pol")).replace(/\{lim\}/g,CFG.boxCny);
 var h='<b style="color:var(--tx)">'+tx("polt")+'</b><ul>'+pol.split(/\||\n/).filter(Boolean).map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+'</ul>';
 var info=[["bizl",b.bizname],["ceo",b.ceo],["bn",b.bizno],["tel",b.tel]].filter(function(x){return x[1]}).map(function(x){return tx(x[0])+": "+esc(String(x[1]))});
 return h+(info.length?'<p style="margin:10px 0 0">'+info.join(" | ")+'</p>':"")}
function orderText(){
 var n=document.getElementById("fn"),w=document.getElementById("fw"),a=document.getElementById("fa");
 var o="【首尔跑腿订单 / 서울 심부름꾼 주문】\n订单号: "+curNo+"\n";
 PRODUCTS.forEach(function(p){if(cart[p.id])o+="- "+p.zh+" ("+p.ko+") x"+cart[p.id]+" = "+fmt(p.krw*cart[p.id])+"\n"});
 links.forEach(function(l,i){o+="- 链接"+(i+1)+": "+l.u+" x"+l.q+(l.o?" ["+l.o+"]":"")+"\n"});
 var x=totals();
 o+="\n商品小计: "+fmt(x.s)+"\n手续费: "+fmt(x.f)+(x.bf?"\n检品包装费: "+fmt(x.bf):CFG.boxFee&&qtyN()?"\n检品包装费: 免费":"")+"\nEMS运费 / 배송비: "+(shipOk()?fmt(x.sf)+" ("+(sh.n>1?sh.n+"箱 × ":"")+sh.k+"kg, 预估"+(+sh.kg.toFixed(2))+"kg)":"需报价 / 견적 필요")+(x.pf?"\n支付手续费: "+fmt(x.pf):"")+"\n合计"+(links.length?"(不含链接商品)":"")+": "+fmt(x.t)+" "+cny(x.t)+"\n";
 o+="\n姓名: "+(n?n.value:"")+"\n微信: "+(w?w.value:"")+"\n电话: "+document.getElementById("fp").value+"\n邮编: "+document.getElementById("fz").value+"\n地址: "+(a?a.value:"")+"\n备注: 运费以实际称重为准 / 배송비는 실제 무게로 정산";
 return o}
function submitO(){
 var b=document.getElementById("sb");
 var n=Object.keys(cart).filter(function(k){return cart[k]>0}).length+links.length;
 if(!n){b.textContent=tx("need");return}
 if(sh.st<0){b.textContent=tx("selw");return}
 if(!document.getElementById("fg").checked){b.textContent=tx("agr");return}
 if(!document.getElementById("fv").checked){b.textContent=tx("pva");return}
 var v=function(i){return document.getElementById(i).value.trim()};
 if(!v("fn")||!v("fw")||!v("fp")||!v("fa")){b.textContent=tx("reqf");return}
 curNo=newNo();var t=orderText(),x=totals(),hasL=links.length>0;
 document.getElementById("ot").value=t;
 var data={orderNo:curNo,name:v("fn"),wechat:v("fw"),phone:v("fp"),zip:v("fz"),address:v("fa"),
  items:PRODUCTS.filter(function(p){return cart[p.id]}).map(function(p){return p.zh+" / "+p.ko+" x"+cart[p.id]}).join("; "),
  links:links.map(function(l){return l.u+" x"+l.q+(l.o?" ["+l.o+"]":"")}).join("; "),
  subtotal:x.s,fee:x.f,boxFee:x.bf,payFee:x.pf,shipTier:shipOk()?(sh.n>1?sh.n+"箱 × ":"")+sh.k+"kg (预估"+sh.kg.toFixed(2)+"kg)":"QUOTE",shipping:x.sf,total:x.t,text:t};
 if(CFG.endpoint.indexOf("http")!=0){b.textContent=tx("fail");return}
 b.textContent=tx("sending");b.disabled=true;
 // 응답 본문이 "ok"일 때만 접수 완료로 처리 (시트 저장 실패 시 실패 안내)
 fetch(CFG.endpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)})
 .then(function(r){return r.text()})
 .then(function(t){if(String(t).trim()!=="ok")throw new Error(t);var no=curNo;curNo="";cart={};links=[];draw();showOk(no,t,hasL)})
 .catch(function(){b.disabled=false;b.textContent=tx("fail")});
}
function copyOk(){var a=document.getElementById("okt"),b=document.getElementById("okb");
 try{navigator.clipboard.writeText(a.value).then(function(){b.textContent=tx("cpd")},fb)}catch(e){fb()}
 function fb(){a.select();try{document.execCommand("copy");b.textContent=tx("cpd")}catch(x){}}}
function copyO(){
 var items=Object.keys(cart).filter(function(k){return cart[k]>0}).length+links.length;
 var b=document.getElementById("cb");
 if(!items){b.textContent=tx("need");return}
 if(sh.st<0){b.textContent=tx("selw");return}
 if(!document.getElementById("fg").checked){b.textContent=tx("agr");return}
 if(!document.getElementById("fv").checked){b.textContent=tx("pva");return}
 if(!curNo)curNo=newNo();var t=orderText();document.getElementById("ot").value=t;
 try{navigator.clipboard.writeText(t).then(function(){b.textContent=tx("cpd")},function(){fb()})}catch(e){fb()}
 function fb(){var e=document.getElementById("ot");e.select();try{document.execCommand("copy");b.textContent=tx("cpd")}catch(x){}}}
function draw(){sh=autoSh();
 document.getElementById("imgnote").textContent=PRODUCTS.some(function(p){return p.img})?tx("imn"):"";
 document.getElementById("proc").innerHTML='<b style="color:var(--tx);font-weight:600">'+tx("prl")+'</b> '+tx("pr").split("|").map(function(x){return x}).join(" › ");
 document.getElementById("ft").innerHTML=footHtml();
 document.documentElement.lang=L=="zh"?"zh-CN":"ko";
 ["t1","t2"].forEach(function(k){document.getElementById(k).textContent=tx(k)});
 document.getElementById("bz").className=L=="zh"?"on":"";document.getElementById("bk").className=L=="ko"?"on":"";
 [0,1].forEach(function(i){var b=document.getElementById("tb"+i);b.textContent=tx("tb"+i);b.className=tab==i?"on":"";document.getElementById("v"+i).className=tab==i?"":"hide"});
 var h="";
 PRODUCTS.forEach(function(p){
  var nm=L=="zh"?p.zh:p.ko;
  h+='<div class="card p"><div class="em">'+(p.img?'<img src="'+esc(p.img)+'" alt="" loading="lazy" style="width:72px;height:72px;object-fit:cover;border-radius:12px">':(p.e||"🛍️"))+'</div><div class="i"><b>'+esc(nm)+'</b>'+(p.brand?'<span class="mut" style="display:block">'+esc(p.brand)+'</span>':'')+'<span class="mut">'+(L=="zh"?'<b style="color:var(--tx);font-size:16px">'+cn(p.krw)+'</b> · '+fmt(p.krw):fmt(p.krw)+' · '+cn(p.krw))+'</span></div>'+
  (p.sold?'<span class="mut">'+tx("sold")+'</span>':'<div class="q"><button onclick="chg('+p.id+',-1)">−</button><span>'+(cart[p.id]||0)+'</span><button onclick="chg('+p.id+',1)">+</button></div>')+'</div>'});
 if(!PRODUCTS.length)h='<p class="mut">'+tx(cfgState=="fail"?"pf":"pl")+'</p>';
 document.getElementById("v0").innerHTML=h;
 // keep link inputs while redrawing
 var v1=document.getElementById("v1");
 if(!document.getElementById("lu")){
  v1.innerHTML='<div class="card"><p class="note" id="l0" style="margin:0 0 6px;color:var(--ac)"></p><label style="margin-top:0">'+'<span id="l1"></span></label><input id="lu" inputmode="url"><label><span id="l2"></span></label><input id="lo"><label><span id="l3"></span></label><input id="lq" type="number" min="1" value="1"><button class="btn" id="la" onclick="addLink()"></button></div>'}
 document.getElementById("l0").textContent=tx("lnote");document.getElementById("l1").textContent=tx("lk");document.getElementById("lu").placeholder=tx("lkp");
 document.getElementById("l2").textContent=tx("op");document.getElementById("l3").textContent=tx("qty");document.getElementById("la").textContent=tx("addl");
 // cart
 var x=totals(),c="<b>"+tx("ct")+"</b>",n=0;
 PRODUCTS.forEach(function(p){if(cart[p.id]){n++;c+='<div class="row"><span>'+(L=="zh"?p.zh:p.ko)+' ×'+cart[p.id]+'</span><span>'+fmt(p.krw*cart[p.id])+'</span></div>'}});
 links.forEach(function(l,i){n++;c+='<div class="row"><span style="word-break:break-all">'+tx("lt")+' '+(i+1)+' ×'+l.q+'<br><span class="mut">'+esc(l.u)+(l.o?' · '+esc(l.o):'')+'</span></span><button class="rm" onclick="delLink('+i+')">'+tx("rm")+'</button></div>'});
 if(!n)c+='<p class="mut">'+tx("empty")+'</p>';
 else c+='<div class="row tot"><span>'+tx("sub")+'</span><span>'+fmt(x.s)+'</span></div><div class="row"><span>'+tx("fee")+' ('+Math.round(CFG.fee*100)+'%'+(L=="zh"?"，最低":", 최소")+' '+fmt(CFG.min)+')</span><span>'+fmt(x.f)+'</span></div>'+(x.bf?'<div class="row"><span>'+tx("bf")+(sh.n>1?' ×'+sh.n:'')+'</span><span>'+fmt(x.bf)+'</span></div>':CFG.boxFee&&qtyN()?'<div class="row"><span>'+tx("bf")+'</span><span><s style="opacity:.5">'+fmt(CFG.boxFee*(sh.n||1))+'</s> <b style="color:var(--ac)">'+tx("free")+'</b></span></div>':'')+'<div class="row"><span>'+tx("sz")+'</span><span>'+shipTxt()+'</span></div><div class="row"><span>'+tx("sp")+'</span><span>'+(sh.st==2?tx("quote"):fmt(x.sf)+" "+cny(x.sf))+'</span></div>'+(x.pf?'<div class="row"><span>'+tx("pyf")+' ('+(+(CFG.payFee*100).toFixed(1))+'%)</span><span>'+fmt(x.pf)+'</span></div>':'')+'<div class="row tot"><span>'+tx("tot")+'</span><span>'+fmt(x.t)+' '+cny(x.t)+'</span></div><p class="note">'+(CFG.boxFee&&CFG.boxFree>0?'<b style="color:var(--ac)">'+(x.bf?tx("bfmore").replace("{n}",fmt(CFG.boxFree-x.s)):tx("bfok").replace("{n}",fmt(CFG.boxFree)))+'</b><br>':'')+(links.length?'<b style="color:var(--ac)">'+tx("lnote")+'</b><br>':'')+(sh.n>1?tx("box").replace("{lim}",CFG.boxCny).replace("{n}",sh.n)+'<br>':'')+rateTxt()+'<br>'+tx("est").replace("{max}",CFG.maxKg)+'</p>';
 document.getElementById("cart").innerHTML=c;
 document.getElementById("info").innerHTML='<b>'+tx("it")+'</b><ul style="margin:6px 0 0;padding-left:18px">'+tx("il").split("|").map(function(s){return "<li>"+s+"</li>"}).join("")+'</ul>';
 // form (preserve typed values)
 var fm=document.getElementById("form"),old={};
 ["fn","fw","fa","fp","fz"].forEach(function(i){var e=document.getElementById(i);if(e)old[i]=e.value});var ck=document.getElementById("fg"),was=ck&&ck.checked,pk=document.getElementById("fv"),pwas=pk&&pk.checked;
 fm.innerHTML='<label style="margin-top:0">'+tx("nm")+'</label><input id="fn"><label>'+tx("wx")+'</label><input id="fw"><label>'+tx("ph")+'</label><input id="fp" inputmode="tel"><label>'+tx("pc")+'</label><input id="fz" inputmode="numeric"><label>'+tx("ad")+'</label><textarea id="fa" rows="2"></textarea><label style="display:flex;gap:8px;align-items:flex-start;color:var(--tx)"><input id="fg" type="checkbox" style="width:auto;margin-top:4px"><span>'+tx("ag")+'</span></label><label style="display:flex;gap:8px;align-items:flex-start;color:var(--tx)"><input id="fv" type="checkbox" style="width:auto;margin-top:4px"><span>'+tx("pv")+'</span></label><ul class="note" style="margin:4px 0 0;padding-left:18px">'+tx("pvd").split("｜").map(function(s){return "<li>"+s+"</li>"}).join("")+'</ul><button class="btn" id="sb" onclick="submitO()">'+tx("submit")+'</button><button class="btn o" id="cb" onclick="copyO()">'+tx("cp")+'</button><textarea id="ot" rows="5" readonly style="font-size:12px"></textarea><p class="note">'+tx("go")+' <b>'+esc(CFG.wechat)+'</b></p>'+qrHtml();
 for(var k in old)document.getElementById(k).value=old[k];document.getElementById("fg").checked=!!was;document.getElementById("fv").checked=!!pwas}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function applyCfg(c){
 if(c.products&&c.products.length)PRODUCTS=c.products.map(function(r){return{id:+r.id,e:r.emoji||"🛍️",zh:r.zh||"",ko:r.ko||r.zh||"",brand:r.brand||"",krw:+r.krw||0,img:r.img||"",sold:r.sold==="Y",g:+r.g||0}});
 var o=c.settings||{};
 if(o.wechat)CFG.wechat=String(o.wechat);
 if(o.qr)CFG.qr=String(o.qr);
 CFG.biz={bizname:o.bizname,ceo:o.ceo,bizno:o.bizno,tel:o.tel};
 if(o.policy_zh)CFG.polZh=String(o.policy_zh);
 if(o.policy_ko)CFG.polKo=String(o.policy_ko);
 if(+o.fee>0)CFG.fee=+o.fee;
 if(o.min!==undefined&&o.min!=="")CFG.min=+o.min;
 if(o.box_fee!==undefined&&o.box_fee!=="")CFG.boxFee=+o.box_fee||0;
 if(o.box_free_over!==undefined&&o.box_free_over!=="")CFG.boxFree=+o.box_free_over||0;
 if(o.pay_fee!==undefined&&o.pay_fee!=="")CFG.payFee=+o.pay_fee||0;
 if(+o.cny_krw>0)CFG.rate=1/+o.cny_krw;
 if(o.box_cny!==undefined&&o.box_cny!=="")CFG.boxCny=+o.box_cny||0;
 if(+o.default_g>0)CFG.defG=+o.default_g;
 if(o.pack_g!==undefined&&o.pack_g!=="")CFG.packG=+o.pack_g||0;
 if(+o.max_kg>0)CFG.maxKg=+o.max_kg;
 if(o.ship_extra!==undefined&&o.ship_extra!=="")CFG.extra=+o.ship_extra||0;
 if(o.ems_table){var et=parseEms(o.ems_table);if(et.length)CFG.ems=et}
 cfgState="ok"}
if(CFG.endpoint.indexOf("http")==0){
 try{var cc=localStorage.getItem("cfg");if(cc)applyCfg(JSON.parse(cc))}catch(e){}
 fetch(CFG.endpoint+"?action=config").then(function(r){return r.json()}).then(function(c){applyCfg(c);try{localStorage.setItem("cfg",JSON.stringify(c))}catch(e){}draw()}).catch(function(){if(!PRODUCTS.length)cfgState="fail";draw()});
}
draw();
</script></body></html>
