  </g>
  <text x="176" y="86" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="58" font-weight="700" fill="#1F1D1A" letter-spacing="4">首尔跑腿</text>
  <text x="178" y="128" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="500" fill="#E0485C">서울 심부름꾼 · 替你逛首尔</text>
